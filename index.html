<style>

.aw{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#F5F8FD;border-radius:14px;padding:0 12px;color:var(--mut);transition:border-color .15s,box-shadow .15s}

.eye{border:0;background:none;color:var(--mut);padding:6px;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.alink{text-align:right;margin:6px 0 14px}.alink button{border:0;background:none;color:var(--pri);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.ab{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--pri);border-radius:14px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
.ab.p{background:linear-gradient(135deg,#0B2A5B,#14618F 60%,#0E9F9E);color:#fff;border:0;box-shadow:0 12px 22px -12px rgba(11,42,91,.7)}
.ab:disabled{opacity:.6;cursor:wait}
.aor{display:flex;align-items:center;gap:10px;margin:18px 0 0;color:var(--mut);font-size:12.5px}.aor::before,.aor::after{content:"";flex:1;height:1px;background:var(--line)}

.await{width:68px;height:68px;border-radius:22px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;margin-bottom:16px}.await.bad{background:#FDE8E6;color:#B3261E}
.aspin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:auto}@keyframes sp{to{transform:rotate(360deg)}}

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const since=d=>diff(d,TODAY),until=d=>diff(TODAY,d);
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}):'—';
const age=t=>{if(!t)return'';const b=new Date(t),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;return a>=0&&a<130?String(a):''};
const ini=n=>{const w=String(n||'?').replace(/^(tn|ny|an)\.?\s+/i,'').trim().split(/\s+/);return((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()};
const IC={plus:'<path d="M12 5v14M5 12h14"/>',konf:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',per:'<path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 19l-5-10V3"/><path d="M7.5 15h9"/>',siap:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/>',sel:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',tut:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',wa:'<path d="M21 12a8 8 0 0 1-11.9 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 13h4"/>',id:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h4M14 13h3"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',heart:'<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ic=(n,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
Object.assign(IC,{mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 5.5L20 8"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.5 7.6C3.9 9.3 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'});
const ST={konf:'Menunggu konferensi',per:'Menunggu pemeriksaan',siap:'Siap tindakan',sel:'Selesai',tut:'Ditutup'};
const PLAN={dse:'DSE',tm:'Treadmill',echo:'Echo ulang',dca:'DCA ulang',via:'Viability study',lain:'Pemeriksaan lain'};
const CLOSE={menolak:'Pasien menolak',rujuk:'Dirujuk ke RS lain',meninggal:'Meninggal',lost:'Tidak dapat dihubungi'};
const KAT={konservatif:'Konservatif',staging:'Staging PCI',pci:'PCI',cabg:'CABG',hybrid:'Hybrid',tavi:'Katup / TAVI',lain:'Lainnya'};
const SP=['dr. Adriyawan Widya Nugraha, SpJP(K)','dr. Arief Wibisono, SpJP(K)','dr. Evit Ruspiono, SpJP(K)','Dr. dr. Tri Astiawati, SpJP(K)'];
const BT=['dr. Arief Budi Septani, SpBTKV','dr. Prima Abdillah Akbar, SpBTKV'];
const ROLES={input:'Penginput (perawat / admin)',dokter:'Dokter verifikator',admin:'Admin koordinator'};
const st=p=>p.tutup?'tut':p.selesai?'sel':p.perlu?'per':p.verif?'siap':'konf';
const sigOk=p=>p.sp1&&p.sp2&&p.sp1!==p.sp2&&p.sb;
const V='Menunggu verifikasi dokter';
const todo=p=>!p.keputusan?'Isi keputusan konferensi':!sigOk(p)?'Pilih 2 SpJP + 1 SpBTKV':V;
let P=[],S={};
let tab='home',role='input',flt='all',q='',cur=null,fotoUrl='';
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
const chip=p=>{const s=st(p);return`<span class="chip c-${s}">${ic(s,12)}${ST[s]}</span>`};
function sub(p){const s=st(p);return s=='konf'?todo(p):s=='per'?`${PLAN[p.jp]||'Jenis belum diisi'} · ${since(p.tglKonf)} hr menunggu`:s=='siap'?(p.tglTindakan?`${p.jenisTindakan||'Tindakan'} · ${fmt(p.tglTindakan)}`:'Tanggal tindakan belum diisi'):s=='sel'?'Selesai '+fmt(p.selesai):CLOSE[p.tutup]}
const prow=(p,x)=>`<button class="row" data-open="${p.id}"><span class="av a-${st(p)}">${esc(ini(p.nama))}</span><span class="m"><b>${esc(p.nama)}</b><small>${x||esc(sub(p))}</small></span>${x?`<span class="dd">${since(p.tglKonf)} hr</span>`:chip(p)}</button>`;
function home(){
 const per=P.filter(p=>st(p)=='per');
 const need=P.filter(p=>st(p)=='konf'&&(role!='dokter'||todo(p)==V));
 const soon=P.filter(p=>st(p)=='siap'&&p.tglTindakan&&until(p.tglTindakan)>=0&&until(p.tglTindakan)<=7).sort((a,b)=>a.tglTindakan.localeCompare(b.tglTindakan));
 const keys=Object.keys(PLAN).concat('none');
 const grp=k=>per.filter(p=>(p.jp||'none')==k);
 const lines=keys.filter(k=>grp(k).length).map(k=>(k=='none'?'Jenis belum diisi':PLAN[k])+` (${grp(k).length}):\n`+grp(k).map((p,i)=>`${i+1}. ${p.nama} — RM ${p.rm}${p.telp?' — '+p.telp:''}${p.tglPeriksa?' — target '+fmt(p.tglPeriksa):''}`).join('\n')).join('\n\n');
 const wa='https://wa.me/?text='+encodeURIComponent(`Pasien menunggu pemeriksaan (${fmt(TODAY)})\n\n`+lines);
 const pend=P.filter(p=>!['sel','tut'].includes(st(p))).length;
 const stats=['konf','per','siap','sel'].map(k=>`<div class="stt"><span class="ico">${ic(k,15)}</span><b>${P.filter(p=>st(p)==k).length}</b><small>${ST[k]}</small></div>`).join('');
 return`<div class="tophero"><div class="top"><h1>Hari ini</h1><button class="btn w" data-new>${ic('plus')} Pasien baru</button></div><div class="sub">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})} · ${pend} pasien masih berjalan</div><div class="stts">${stats}</div></div>
 <div class="sub" style="margin:10px 0 0">Masuk sebagai ${esc(ME.nama)} · ${RL[ME.role]}</div>${bkWarn()}
 <section class="blk hero"><div class="bh"><span class="ico i-per">${ic('per')}</span>Menunggu pemeriksaan<span class="n">${per.length}</span></div>
 ${per.length?keys.filter(k=>grp(k).length).map(k=>`<div class="gt">${k=='none'?'Jenis belum diisi':PLAN[k]}<i>${grp(k).length} pasien</i></div>`+grp(k).map(p=>prow(p,`RM ${esc(p.rm)}${p.telp?' · '+esc(p.telp):''}${p.tglPeriksa?' · target '+fmt(p.tglPeriksa):''}`)).join('')).join('')+`<a class="wa" href="${wa}" target="_blank" rel="noopener">${ic('wa')} Kirim daftar ke WhatsApp</a>`:'<div class="empty">Tidak ada pasien yang menunggu pemeriksaan.</div>'}</section>
 <section class="blk"><div class="bh"><span class="ico i-need">${ic(role=='dokter'?'shield':'bell')}</span>${role=='dokter'?'Perlu diverifikasi':'Perlu ditindaklanjuti'}<span class="n">${need.length}</span></div>
 ${need.length?need.map(p=>prow(p).replace(chip(p),role=='dokter'?`<span class="btn s" data-qv="${p.id}">${ic('shield',14)} Verifikasi</span>`:'')).join(''):'<div class="empty">Semua beres untuk saat ini.</div>'}</section>
 <section class="blk"><div class="bh"><span class="ico i-siap">${ic('siap')}</span>Tindakan 7 hari ke depan<span class="n">${soon.length}</span></div>
 ${soon.length?soon.map(p=>prow(p,`${esc(p.jenisTindakan||'Tindakan')} · ${fmt(p.tglTindakan)}`).replace(/<span class="dd">.*?<\/span>/,`<span class="dd">${until(p.tglTindakan)?until(p.tglTindakan)+' hr lagi':'hari ini'}</span>`)).join(''):'<div class="empty">Belum ada tindakan terjadwal.</div>'}</section>`}
function list(){
 const cnt=k=>k=='all'?P.length:P.filter(p=>st(p)==k).length;
 let r=P.filter(p=>flt=='all'||st(p)==flt);
 if(q)r=r.filter(p=>[p.nama,p.rm,p.dx,p.keputusan].join(' ').toLowerCase().includes(q.toLowerCase()));
 return`<div class="top"><h1>Pasien</h1><button class="btn p" data-new>${ic('plus')} Pasien baru</button></div><input class="search" id="q" type="search" placeholder="Cari nama atau No RM" value="${esc(q)}" aria-label="Cari pasien">
 <div class="chips">${['all','konf','per','siap','sel','tut'].map(k=>`<button class="fc" data-f="${k}" aria-pressed="${flt==k}">${k=='all'?'':ic(k,13)}${k=='all'?'Semua':ST[k]} ${cnt(k)}</button>`).join('')}</div>
 <section class="blk">${r.length?r.map(p=>prow(p)).join(''):'<div class="empty">Tidak ada pasien yang cocok. Ubah filter atau tekan Pasien baru.</div>'}</section>`}
function render(){$('#app').innerHTML=tab=='home'?home():tab=='list'?list():more();
 document.querySelectorAll('.nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.t==tab)||b.removeAttribute('aria-current'));
 document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.t==tab)b.setAttribute('aria-current','page')});
 const bd={home:role=='dokter'?P.filter(needV).length:0,more:USERS.filter(u=>u.status=='pending').length};document.querySelectorAll('.nav button').forEach(b=>{let x=b.querySelector('.bdg');if(!x){x=document.createElement('i');x.className='bdg';b.appendChild(x)}const c=bd[b.dataset.t]||0;x.hidden=!c;x.textContent=c});
 $('#fab').hidden=tab=='more'}
/* ---------- form ---------- */
const opt=(o,v,ex)=>(Array.isArray(o)?o.map(x=>[x,x]):Object.entries(o)).filter(([k])=>k!==ex).map(([k,l])=>`<option value="${esc(k)}"${k===v?' selected':''}>${esc(l)}</option>`).join('');
const fld=(k,l,t,x)=>{x=x||{};const d=(x.d||RO)?' disabled':'';return`<label class="f${x.w?' w':''}"><span>${l}</span>${t=='ta'?`<textarea data-k="${k}" rows="2" placeholder="${x.ph||''}"${d}>${esc(cur[k])}</textarea>`:t=='sel'?`<select data-k="${k}"${d}><option value="">Pilih…</option>${opt(x.o,cur[k]||'',x.ex)}</select>`:`<input data-k="${k}" type="${t||'text'}" value="${esc(cur[k])}" placeholder="${x.ph||''}"${d}${t=='number'?' inputmode="decimal" step="any"':''}>`}</label>`};
function openForm(p){cur=p?JSON.parse(JSON.stringify(p)):{id:'p'+Math.random().toString(36).slice(2,8),tglKonf:TODAY};fotoUrl='';$('#ov').hidden=false;document.body.style.overflow='hidden';drawForm(0)}
function closeForm(){acc=false;bkOpen=false;$('#ov').hidden=true;document.body.style.overflow='';cur=null}
function drawForm(keep){
 RO=!canEdit(cur);const sh=$('#sh'),sc=keep?sh.scrollTop:0,lock=!!cur.verif,can=ME.role=='dokter'||ME.role=='superadmin',s=st(cur);
 const ok=sigOk(cur)&&cur.keputusan;
 sh.innerHTML=`<div class="sh"><h2>${esc(cur.nama||'Pasien baru')}</h2><button class="btn" data-a="close">Tutup</button></div><div class="sb">
 ${RO?`<div class="rule lock" style="margin-bottom:12px">Hanya dapat dilihat. Data ini diinput oleh ${esc(cur.byName||'akun lain')}.${can?' Anda dapat memverifikasi atau membatalkan verifikasi.':''}</div>`:''}${lock?`<div class="rule lock" style="margin-bottom:12px">Terverifikasi ${fmt(cur.verif.at)}${cur.verif.nama?' oleh '+esc(cur.verif.nama):''}. Keputusan dan dokter terkunci.${can?' <button class="btn s" data-a="unlock">Buka kunci</button>':''}</div>`:''}
 <fieldset><legend>${ic('id',16)} Daftar cepat</legend>
 ${fld('nama','Nama pasien','text',{w:1})}${fld('rm','No RM','text')}${fld('telp','No. telepon / WhatsApp','tel',{ph:'0812…'})}
 ${fld('tglLahir','Tanggal lahir','date')}${fld('usia','Usia (tahun)','number',{ph:'otomatis'})}${fld('jk','Jenis kelamin','sel',{o:{L:'Laki-laki',P:'Perempuan'}})}${fld('tglKonf','Tanggal konferensi','date')}
 ${fld('dx','Diagnosis','text',{w:1,ph:'Contoh: CAD 3VD LM disease'})}</fieldset>
 <fieldset><legend>${ic('clip',16)} Hasil konferensi</legend>
 <label class="f w"><span>${ic('cam',14)} Foto hasil konferensi</span><input type="file" id="foto" accept="image/*" capture="environment"${RO?' disabled':''}>${fotoUrl?`<img src="${fotoUrl}" alt="Foto hasil konferensi" style="max-width:100%;border-radius:12px;margin-top:6px">`:''}</label>
 ${fld('keputusan','Keputusan','ta',{w:1,d:lock,ph:'Tulis keputusan Heart Team'})}${fld('kat','Kategori','sel',{o:KAT,d:lock})}
 ${fld('sp1','SpJP 1','sel',{o:SP,ex:cur.sp2,d:lock})}${fld('sp2','SpJP 2','sel',{o:SP,ex:cur.sp1,d:lock})}${fld('sb','SpBTKV','sel',{o:BT,d:lock,w:1})}
 <div class="rule${sigOk(cur)?' ok':''}">Ketentuan: 2 SpJP berbeda + 1 SpBTKV — ${sigOk(cur)?'terpenuhi.':'belum lengkap.'}</div>
 <label class="chk"><input type="checkbox" data-k="perlu"${cur.perlu?' checked':''}${s=='tut'||s=='sel'||RO?' disabled':''}> Perlu pemeriksaan sebelum memutuskan</label>
 ${cur.perlu?`${fld('jp','Jenis pemeriksaan','sel',{o:PLAN})}${fld('tglPeriksa','Target tanggal','date')}${RO?'':'<div class="w2"><button class="btn s" data-a="hasil">Hasil pemeriksaan sudah masuk</button></div>'}`:''}
 ${can&&!lock&&!cur.perlu?`<div class="w2"><button class="btn p" data-a="verify"${ok?'':' disabled'} style="width:100%;justify-content:center">${ic('shield')} Verifikasi keputusan</button>${ok?'':'<div class="sub" style="margin-top:4px">Lengkapi keputusan dan 3 dokter dulu.</div>'}</div>`:!lock&&!cur.perlu?`<div class="rule w2">Verifikasi dilakukan oleh dokter verifikator.</div>`:''}</fieldset>
 ${lock||s=='sel'?`<fieldset><legend>${ic('siap',16)} Tindakan</legend>${fld('jenisTindakan','Jenis tindakan','text',{ph:'Contoh: PCI LAD'})}${fld('tglTindakan','Tanggal tindakan','date')}${s!='sel'?(RO?'':`<div class="w2"><button class="btn s" data-a="done">Tandai tindakan selesai</button></div>`):`<div class="rule ok">Selesai ${fmt(cur.selesai)}.</div>`}</fieldset>`:''}
 <details class="opt" open><summary><span>${ic('per',17)} Laboratorium</span><small>8 pemeriksaan</small></summary><div class="g">
 ${fld('hiv','Skrining HIV','sel',{o:{NR:'Non-reaktif (NR)',R:'Reaktif (R)'}})}${fld('hbsag','Hepatitis B (HBsAg)','sel',{o:{NR:'Non-reaktif (NR)',R:'Reaktif (R)'}})}
 ${fld('ureum','Ureum (mg/dL)','number')}${fld('kreatinin','Kreatinin (mg/dL)','number')}
 ${fld('gda','GD sewaktu / GDA (mg/dL)','number')}${fld('gdp','GD puasa (mg/dL)','number')}
 ${fld('gd2pp','GD 2 jam PP (mg/dL)','number')}${fld('hba1c','HbA1c (%)','number')}
 </div></details>
 <details class="opt"><summary><span>${ic('heart',17)} Data klinis</span><small>opsional</small></summary><div class="g">
 ${fld('sts','STS score (%)','number')}${fld('euro','EuroSCORE II (%)','number')}${fld('syn2','SYNTAX II (%)','number')}${fld('syn','SYNTAX score','number')}
 ${fld('ef','EF (%)','number')}${fld('tapse','TAPSE (cm)','number')}${fld('mitral','Mitral','text')}${fld('tric','Tricuspid','text')}${fld('aorta','Aorta','text')}${fld('pulm','Pulmonal','text')}
 ${fld('lm','Left Main','text')}${fld('lad','LAD','text')}${fld('lcx','LCx','text')}${fld('rca','RCA','text')}
 ${fld('dxPasca','Kesimpulan pasca tindakan','text',{w:1,ph:'Contoh: CAD 3VD LM disease'})}${fld('viab','Viability','sel',{o:{dse:'DSE',mri:'Cardiac MRI'},w:1})}${fld('viabHasil','Hasil viability','ta',{w:1,ph:'Contoh: viable di segmen anterior'})}${fld('pci','Riwayat PCI','ta',{w:1,ph:'Narasi bebas'})}
 <div class="rule lock w2">Skor STS, EuroSCORE II, dan SYNTAX II diisi manual dari kalkulator resmi.</div></div></details>
 <details class="opt"><summary><span>${ic('tut',17)} Tutup kasus</span><small>menolak, dirujuk, meninggal, lost</small></summary><div class="g">${fld('tutup','Alasan penutupan','sel',{o:CLOSE,w:1})}</div></details>
 </div><div class="sf"><button class="btn" data-a="close"${RO?' style="flex:1"':''}>${RO?'Tutup':'Batal'}</button>${canDel(cur)?'<button class="btn" data-a="del" style="color:var(--red)">Hapus</button>':''}${RO?'':'<button class="btn p" data-a="save">Simpan</button>'}</div>`;
 sh.scrollTop=sc}
function commit(msg){if(!cur.nama||!cur.nama.trim()||!cur.rm||!cur.rm.trim()){toast('Nama dan No RM wajib diisi');return false}
 const d=P.find(x=>x.id!==cur.id&&x.rm.trim()==cur.rm.trim());if(d){toast('No RM sudah terdaftar atas nama '+d.nama);return false}
 const i=P.findIndex(x=>x.id==cur.id);if(i<0){cur.by=ME.uid;cur.byName=ME.nama;P.unshift(cur)}else P[i]=cur;persist();closeForm();render();toast(msg||'Tersimpan');return true}
$('#sh').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;cur[k]=e.target.type=='checkbox'?e.target.checked:e.target.value});
$('#sh').addEventListener('change',e=>{const k=e.target.dataset.k;
 if(e.target.id=='foto'&&e.target.files[0]){fotoUrl=URL.createObjectURL(e.target.files[0]);drawForm(1);return}
 if(!k)return;if(k=='tglLahir'){const a=age(cur.tglLahir);if(a)cur.usia=a}
 if(['perlu','sp1','sp2','sb','tglLahir','tutup'].includes(k))drawForm(1)});
$('#sh').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const x=a.dataset.a;
 if(x=='close')closeForm();

auth.onAuthStateChanged(u=>{[uU,uP,uS,uB].forEach(f=>f&&f());uU=uP=uS=uB=null;BK=undefined;ME=null;ENT=false;P=[];S={};USERS=[];
 if(!u){try{window.AndroidApp&&window.AndroidApp.setRole('')}catch(e){}$('#app').innerHTML='';drawAuth('login');return}
 uU=db.collection('users').doc(u.uid).onSnapshot(s=>{const d=s.data();
  if(!d){if(!REG)drawAuth('blok','Akun belum terdaftar. Hubungi koordinator.');return}
  if(d.status=='aktif'&&d.role){ME=Object.assign({uid:u.uid},d);enter()}
  else if(d.status=='pending')drawAuth('tunggu');
  else drawAuth('blok','Akun Anda tidak aktif. Hubungi koordinator.')},()=>drawAuth('blok','Tidak dapat membaca data akun.'))});
function enter(){role=RMAP[ME.role];if(ME.role=='superadmin'&&!uB)uB=db.collection('meta').doc('backup').onSnapshot(s=>{BK=s.exists?s.data():false;render();if(bkOpen&&!$('#ov').hidden)drawBackup()},()=>{BK=false});document.body.dataset.role=ME.role;try{window.AndroidApp&&window.AndroidApp.setRole(ME.role)}catch(e){}$('#auth').hidden=true;document.body.style.overflow='';
 if(!ENT){ENT=true;tab='home'}
 if(!uP){first=true;uP=db.collection('patients').onSnapshot(sn=>{const old={};P.forEach(p=>old[p.id]=p);
  if(!first)sn.docChanges().forEach(c=>{if(c.type!='removed'&&!c.doc.metadata.hasPendingWrites)notifyChange(old[c.doc.id],c.doc.data())});
  P=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S={};P.forEach(p=>S[p.id]=JSON.stringify(strip(p)));first=false;render()},()=>toast('Tidak dapat membaca data pasien'))}
 if((ME.role=='koordinator'||ME.role=='superadmin')&&!uS){let f1=true;uS=db.collection('users').onSnapshot(sn=>{
  if(!f1)sn.docChanges().forEach(c=>{if(c.type=='added'&&c.doc.data().status=='pending'&&!c.doc.metadata.hasPendingWrites)ping('Pendaftaran akun baru: '+c.doc.data().nama)});
  f1=false;USERS=sn.docs.map(d=>Object.assign({uid:d.id},d.data()));render();if(acc&&!$('#ov').hidden)drawAccounts()})}
 render()}
function openAccounts(){acc=true;$('#ov').hidden=false;document.body.style.overflow='hidden';drawAccounts()}
function drawAccounts(){
 const su=ME.role=='superadmin',allowed=su?Object.keys(RL):['penginput','dokter'];
 const sel=(at,id,v)=>`<select ${at}="${id}" aria-label="Peran">${allowed.map(k=>`<option value="${k}"${k==v?' selected':''}>${RL[k]}</option>`).join('')}</select>`;
 const pend=USERS.filter(u=>u.status=='pending'),rest=USERS.filter(u=>u.status!='pending'&&u.uid!=ME.uid).sort((a,b)=>String(a.nama).localeCompare(String(b.nama)));
 const manage=u=>su||!['koordinator','superadmin'].includes(u.role);
 const pr=u=>`<div class="ar"><b>${esc(u.nama)}</b><small>${esc(u.email)} · meminta ${RL[u.reqRole]||'—'}</small><div class="ac">${sel('data-s',u.uid,allowed.includes(u.reqRole)?u.reqRole:'penginput')}<button class="btn s" data-ap="${u.uid}">Setujui</button><button class="btn s" data-rj="${u.uid}">Tolak</button></div></div>`;
 const rr=u=>`<div class="ar"><b>${esc(u.nama)}</b><small>${esc(u.email)} · ${u.status=='aktif'?(RL[u.role]||'—'):'Tidak aktif'}</small>${manage(u)?`<div class="ac">${u.status=='aktif'?sel('data-rc',u.uid,u.role):''}<button class="btn s" data-tg="${u.uid}">${u.status=='aktif'?'Nonaktifkan':'Aktifkan'}</button></div>`:''}</div>`;
 const sc=$('#sh').scrollTop;
 $('#sh').innerHTML=`<div class="sh"><h2>Kelola akun</h2><button class="btn" data-a="close">Tutup</button></div><div class="sb"><div class="gt">Menunggu persetujuan<i>${pend.length}</i></div>${pend.length?pend.map(pr).join(''):'<div class="empty">Tidak ada pendaftaran baru.</div>'}<div class="gt" style="margin-top:16px">Akun lain<i>${rest.length}</i></div>${rest.map(rr).join('')||'<div class="empty">Belum ada akun lain.</div>'}<p class="sub" id="accMsg" role="status"></p></div>`;
 $('#sh').scrollTop=sc;
 const upd=(uid,d)=>db.collection('users').doc(uid).update(d).catch(e=>{$('#accMsg').textContent=e.code=='permission-denied'?'Anda tidak punya izin untuk perubahan ini.':'Gagal menyimpan. Coba lagi.'});
 const q=s=>$('#sh').querySelectorAll(s);
 q('[data-ap]').forEach(b=>b.onclick=()=>upd(b.dataset.ap,{role:$('#sh').querySelector(`select[data-s="${b.dataset.ap}"]`).value,status:'aktif'}));
 q('[data-rj]').forEach(b=>b.onclick=()=>upd(b.dataset.rj,{status:'ditolak'}));
 q('[data-rc]').forEach(s=>s.onchange=()=>upd(s.dataset.rc,{role:s.value}));
 q('[data-tg]').forEach(b=>b.onclick=()=>{const u=USERS.find(x=>x.uid==b.dataset.tg);upd(u.uid,u.status=='aktif'?{status:'nonaktif'}:{status:'aktif',role:u.role||(allowed.includes(u.reqRole)?u.reqRole:'penginput')})})}
function more(){const mg=ME.role=='koordinator'||ME.role=='superadmin',np=USERS.filter(u=>u.status=='pending').length;
 return`<h1>Lainnya</h1><div class="sub">${esc(ME.nama)} · ${RL[ME.role]}</div>
 ${ME.role!='penginput'?`<section class="blk"><div class="bh"><span class="ico i-siap">${ic('clip')}</span>Laporan konferensi</div><div class="empty">Unduh hasil konferensi per tanggal dalam bentuk PDF atau Excel, dengan format laporan yang lama.</div><button class="btn p" data-rep style="margin:0 0 12px">${ic('clip',16)} Buka laporan</button></section>`:''}
 ${mg?`<section class="blk"><div class="bh"><span class="ico i-need">${ic('id')}</span>Kelola akun<span class="n">${np}</span></div><div class="empty">Setujui pendaftaran baru, ubah peran, atau nonaktifkan akun.</div><button class="btn p" data-acc style="margin:0 0 12px">Buka daftar akun</button></section>`:''}
 ${ME.role=='superadmin'?`<section class="blk"><div class="bh"><span class="ico i-siap">${ic('tut')}</span>Pengaturan Super Admin</div><div class="empty">${esc(bkInfo())}. Backup berkas JSON untuk berjaga-jaga bila data bermasalah, dan bisa dipulihkan dari sini.</div><button class="btn p" data-bk style="margin:0 0 12px">Backup &amp; pulihkan data</button></section>`:''}
 <section class="blk"><div class="bh"><span class="ico i-per">${ic('bell')}</span>Notifikasi</div><div class="empty">Pemberitahuan saat ada pasien yang perlu diverifikasi atau sudah diverifikasi.</div><button class="btn" data-notif style="margin:0 0 12px">Aktifkan notifikasi</button></section>
 <button class="btn" id="out">Keluar</button>`}
/* ---------- backup & pulihkan (Super Admin) ---------- */
const bkAge=()=>BK&&BK.at?Math.floor((Date.now()-BK.at.toMillis())/864e5):null;
const bkInfo=()=>BK&&BK.at?`Backup terakhir: ${fmtLong(iso(BK.at.toDate()))} (${BK.jumlah} pasien)`:'Belum pernah backup';
const bkWarn=()=>ME.role=='superadmin'&&BK!==undefined&&(bkAge()==null||bkAge()>=7)?`<div class="demo">${bkAge()==null?'Belum pernah backup data.':'Backup terakhir '+bkAge()+' hari lalu.'} <button class="btn s" data-bk>Backup sekarang</button></div>`:'';
const bkFetch=async()=>(await db.collection('patients').get()).docs.map(d=>Object.assign({id:d.id},d.data()));
async function doBackup(tag,rows){rows=rows||await bkFetch();const d=new Date(),stamp=iso(d)+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
 const body=JSON.stringify({app:'heart-team-tracker',versi:1,dibuat:d.toISOString(),oleh:ME.nama,jumlah:rows.length,pasien:rows},null,1);
 await saveFile(`Backup-HeartTeam${tag?'-'+tag:''}_${stamp}.json`,new Blob([body],{type:'application/json'}));
 if(!tag)await db.collection('meta').doc('backup').set({at:firebase.firestore.FieldValue.serverTimestamp(),by:ME.nama,jumlah:rows.length});
 return rows.length}
let bkFile=null,bkArm=false;
function openBackup(){bkOpen=true;bkFile=null;$('#ov').hidden=false;document.body.style.overflow='hidden';drawBackup()}
function drawBackup(msg){const f=bkFile;
 $('#sh').innerHTML=`<div class="sh"><h2>Backup &amp; pulihkan</h2><button class="btn" data-a="close">Tutup</button></div><div class="sb">
 <fieldset style="display:block"><legend>${ic('tut',16)} Backup data pasien</legend><div class="sub" style="margin:6px 0 10px">${esc(bkInfo())}. Berkas JSON berisi seluruh data pasien dan bisa dipulihkan kapan saja. Berkas ini memuat data kesehatan, simpan di tempat aman.</div><button class="btn p" id="bkGo" style="width:100%;justify-content:center">Unduh backup sekarang</button></fieldset>
 <fieldset style="display:block"><legend>${ic('clip',16)} Pulihkan dari backup</legend><label class="f"><span>Berkas backup (.json)</span><input type="file" id="bkIn" accept=".json,application/json"></label>
 ${f?`<div class="rule lock" style="margin-top:10px">Berkas dibuat ${esc(f.dibuat?fmtLong(f.dibuat.slice(0,10)):'—')} oleh ${esc(f.oleh||'—')}, berisi ${f.pasien.length} pasien.</div><label class="chk" style="margin-top:10px"><input type="checkbox" id="bkRep"> Hapus pasien yang tidak ada di berkas ini</label><div class="sub">Tanpa centang, data di berkas ditimpa ke database dan pasien lain dibiarkan. Sebelum memulihkan, aplikasi otomatis mengunduh backup kondisi sekarang.</div><button class="btn" id="bkRun" style="width:100%;justify-content:center;margin-top:10px;color:var(--red)">Pulihkan data</button>`:''}</fieldset>
 <p class="sub" id="bkMsg" role="status">${esc(msg||'')}</p></div>`;
 const m=t=>{$('#bkMsg').textContent=t};
 $('#bkGo').onclick=async e=>{const b=e.currentTarget;b.disabled=true;m('Menyusun backup…');try{const n=await doBackup();m(`Backup berisi ${n} pasien sudah diunduh.`)}catch(x){m('Backup gagal. Periksa koneksi lalu coba lagi.')}b.disabled=false};
 $('#bkIn').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(j.app!='heart-team-tracker'||!Array.isArray(j.pasien)||j.pasien.some(p=>!p||!p.id))throw 0;bkFile=j;drawBackup()}catch(x){bkFile=null;drawBackup('Berkas tidak valid. Gunakan berkas backup dari aplikasi ini.')}};
 if($('#bkRun'))$('#bkRun').onclick=async e=>{const b=e.currentTarget;
  if(!bkArm){bkArm=true;b.textContent='Tekan lagi untuk memulihkan';setTimeout(()=>{bkArm=false;if(b.isConnected)b.textContent='Pulihkan data'},4000);return}
  bkArm=false;b.disabled=true;const rep=$('#bkRep').checked;
  try{m('Mengunduh backup pengaman…');const have=await bkFetch();await doBackup('sebelum-pulih',have);
   const ops=bkFile.pasien.map(p=>['s',p]);if(rep){const ids=new Set(bkFile.pasien.map(p=>p.id));have.filter(p=>!ids.has(p.id)).forEach(p=>ops.push(['d',p]))}
   for(let i=0;i<ops.length;i+=200){const bt=db.batch();ops.slice(i,i+200).forEach(([t,p])=>{const r=db.collection('patients').doc(p.id);if(t=='s')bt.set(r,strip(p));else bt.delete(r)});await bt.commit();m(`Memulihkan… ${Math.min(i+200,ops.length)}/${ops.length}`)}
   const n=bkFile.pasien.length;bkFile=null;drawBackup(`Selesai: ${n} pasien dipulihkan${rep?', pasien lain dihapus':''}.`);return}
  catch(x){m(x&&x.code=='permission-denied'?'Ditolak oleh aturan database. Pastikan firestore.rules terbaru sudah dipublikasikan.':'Pemulihan gagal di tengah jalan. Pakai backup pengaman yang baru diunduh untuk mengembalikan.')}
  b.disabled=false}}
/* ---------- global ---------- */
document.addEventListener('click',e=>{
 if(e.target.closest('[data-rep]')){openReport();return}
 if(e.target.closest('[data-acc]')){openAccounts();return}
 if(e.target.closest('[data-bk]')){openBackup();return}
 if(e.target.closest('[data-notif]')){try{Notification.requestPermission().then(r=>toast(r=='granted'?'Notifikasi aktif':'Izin notifikasi ditolak'))}catch(x){toast('Perangkat ini belum mendukung notifikasi')}return}
 if(e.target.id=='out'){auth.signOut();return}
 if(e.target.closest('[data-new]')){openForm();return}
 const qv=e.target.closest('[data-qv]');if(qv){e.stopPropagation();const p=P.find(x=>x.id==qv.dataset.qv);if(p){p.verif=verifObj();persist();render();toast('Keputusan terverifikasi')}return}
 const o=e.target.closest('[data-open]');if(o){openForm(P.find(x=>x.id==o.dataset.open));return}
 const f=e.target.closest('[data-f]');if(f){flt=f.dataset.f;render();return}
 const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;render();return}
 const t=e.target.closest('.nav [data-t]');if(t){tab=t.dataset.t;render();window.scrollTo(0,0);return}
 });
$('#fab').onclick=()=>openForm();

document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;const s=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(s,s)}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#ov').hidden)closeForm()});
</script></body></html>
